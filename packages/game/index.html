<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- スマホ：拡大・縮小させない・ノッチの外側まで使う（操作部は #game の安全な範囲の中。docs/progress TOUCH-4） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>ステラシジル（仮題）</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        overflow: hidden;
        /* 指で触れても、ページのスクロール・拡大・引っ張って更新・文字の選択・長押しのメニューを起こさない */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* ゲームの入れ物：ノッチ・丸い角（safe-area）の内側。PC では窓の全体（env() は 0） */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        overflow: hidden;
      }
      /* 星辰盤の検索の入力欄は、文字を選べるようにする */
      input {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
